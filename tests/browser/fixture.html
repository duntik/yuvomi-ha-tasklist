<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;font-family:Arial;--primary-color:#009cba;--primary-text-color:#222;--secondary-text-color:#666;--divider-color:#ddd;--card-background-color:#fff;--secondary-background-color:#f4f4f4}ha-panel-todo{display:block}span[slot=icon]{font-size:24px;width:24px;height:24px;display:block}</style></head><body><home-assistant><ha-panel-todo></ha-panel-todo></home-assistant><script type="module">
class Dropdown extends HTMLElement{connectedCallback(){this.attachShadow({mode:'open'}).innerHTML='<style>:host{position:relative;display:flex;min-height:48px;align-items:center;padding:8px 16px}#check{visibility:hidden;width:12px}#icon{display:flex}#label{flex:1}#icon ::slotted(*){margin-inline-end:12px!important}</style><span id="check" part="checkmark"></span><span id="icon" part="icon"><slot name="icon"></slot></span><span id="label" part="label"><slot></slot></span><span part="details"></span>';}}
customElements.define('ha-dropdown-item',Dropdown);
const task={id:1,title:'A long household task title that should wrap safely on a small phone screen',status:'open',category:'home',priority:'high',assigned_users:[{id:1,display_name:'Test User'}],tags:[],subtasks:[],description:'Task details',due_date:'2026-10-07'};
window.requests=[];
const hass={language:'en',states:{'todo.yuvomi_tasks':{attributes:{yuvomi_enhance_ui:true}}},async callWS(request){window.requests.push(request);if(request.type==='yuvomi/comments')return [{id:7,author_name:'Test User',comment:'A sample comment',created_at:'2026-10-05'}];if(request.type==='yuvomi/mutate')return {data:task};return {task:structuredClone(task),tasks:[structuredClone(task)],metadata:{categories:[{key:'home',name:'Home'}],users:task.assigned_users}};}};
const panel=document.querySelector('ha-panel-todo');panel.attachShadow({mode:'open'}).innerHTML=`<style>ha-two-pane-top-app-bar-fixed{display:grid;grid-template-columns:var(--sidepane-width,250px) minmax(0,1fr);min-height:100vh}[slot=pane]{display:block;grid-column:1;grid-row:1}.yuvomi-compact-lists .ha-icon{margin-inline:0!important}#columns,yuvomi-task-board{grid-column:2;grid-row:1}@media(max-width:650px){ha-two-pane-top-app-bar-fixed{grid-template-columns:minmax(0,1fr)}[slot=pane]{display:none}#columns,yuvomi-task-board{grid-column:1}}</style><ha-two-pane-top-app-bar-fixed><ha-list slot="pane"><ha-dropdown-item><span slot="icon" class="ha-icon" style="font-size:24px;display:block;width:24px;height:24px">☑</span>Yuvomi Tasks</ha-dropdown-item><ha-dropdown-item><span slot="icon" class="ha-icon" style="font-size:24px;display:block;width:24px;height:24px">🛒</span>Shopping list</ha-dropdown-item></ha-list><div id="columns">Native list</div><button class="fab">Add item</button></ha-two-pane-top-app-bar-fixed>`;
Object.assign(panel,{hass,_entityId:'todo.yuvomi_tasks'});document.querySelector('home-assistant').hass=hass;
await import('/yuvomi.js');
</script></body></html>
